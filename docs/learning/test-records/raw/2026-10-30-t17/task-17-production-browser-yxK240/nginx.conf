upstream resumate_api {
    server host.docker.internal:4274;
    server host.docker.internal:4274;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # One 10 MiB file plus multipart metadata; the API enforces the exact file cap.
    client_max_body_size 11m;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/api/(agent/runs|tasks)/[^/]+/events$ {
        proxy_pass http://resumate_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
    location ~ ^/(api/|auth/|healthz$|readyz$) {
        proxy_pass http://resumate_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 310s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
