[project]
name = "resumate-agent"
version = "0.1.0"
description = "Resume and JD analysis agent for recruiting workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "openai>=1.55.0",
    "chromadb>=1.5.9,<2",
    "anyio>=4.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "langchain>=0.2.14",
    "langchain-core>=0.2.37",
    "langchain-openai>=0.1.22",
    "langgraph>=0.2.31",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "sqlalchemy>=2.0.36",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.0.0"]
ocr = ["rapidocr-onnxruntime>=1.4.4", "pypdfium2>=5.6.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
