# Local API + worker share SQLite inside one Docker Linux VM.
# Never access this live SQLite database from a native macOS process.
name: resumate-agent
services:
  api:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    environment:
      DATABASE_URL: sqlite:////app/data/resumate.db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY for the local API}
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE:-}
      CORS_ORIGINS: http://localhost:5173
    volumes: [backend-data:/app/data]
    ports: ['127.0.0.1:${RESUMATE_API_PORT:-8000}:8000']
    command: [uvicorn, 'backend.app:app', --host, 0.0.0.0, --port, '8000', --workers, '1']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
  redis:
    image: public.ecr.aws/docker/library/redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    ports: ['127.0.0.1:${RESUMATE_REDIS_PORT:-6379}:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 2s
      retries: 10
  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    environment:
      DATABASE_URL: sqlite:////app/data/resumate.db
      REDIS_URL: redis://redis:6379/0
      AGENT_STATE_DIR: /app/data/agent
      LANGCHAIN_TRACING_V2: 'false'
    volumes: [backend-data:/app/data]
    depends_on:
      redis: {condition: service_healthy}
      api: {condition: service_healthy}
    command: [celery, -A, 'backend.worker:app', worker, --loglevel=INFO, --concurrency=1]
    stop_grace_period: 30s
  scheduler:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
    command: [celery, -A, 'backend.worker:app', beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
volumes:
  backend-data:
  redis-data:
